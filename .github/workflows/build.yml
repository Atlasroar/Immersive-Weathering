name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Fabric-only sources and wiki
        run: |
          python tools/fabric.py --check
          python tools/wiki.py --check
          python -B -m unittest discover -s tools -p "test_*.py"
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --console=plain
      - name: Validate remapped and sources artifacts
        shell: pwsh
        run: |
          $version = ((Get-Content gradle.properties | Select-String '^mod_version\s*=') -split '=', 2)[1].Trim()
          python tools/fabric.py --check --jar "build/libs/immersive_weathering-$version.jar" --sources "build/libs/immersive_weathering-$version-sources.jar"
      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-beta
          if-no-files-found: error
          path: build/libs/*.jar
