plugins {
    id "fabric-loom" version "1.7.4"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.mod_id
}

repositories {
    maven {
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url = "https://maven.terraformersmc.com/releases" }
    maven { url = "https://maven.shedaniel.me" }
}

loom {
    accessWidenerPath = file("src/main/resources/immersive_weathering.accesswidener")
    runs {
        server {
            runDir = "run/server"
        }
        client {
            runDir = "run/client"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "curse.maven:selene-499980:${project.moonlight_file_id}"
    modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "fabric_loader_version", project.fabric_loader_version
    inputs.property "moonlight_min_version", project.moonlight_min_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "fabric_loader_version": project.fabric_loader_version,
                "moonlight_min_version": project.moonlight_min_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named("jar") {
    from("LICENSE", "COPYING", "ATTRIBUTIONS")
}

tasks.named("sourcesJar") {
    from("LICENSE", "COPYING", "ATTRIBUTIONS")
    inputs.property "version", project.version
    inputs.property "fabric_loader_version", project.fabric_loader_version
    inputs.property "moonlight_min_version", project.moonlight_min_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "fabric_loader_version": project.fabric_loader_version,
                "moonlight_min_version": project.moonlight_min_version
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = project.mod_id
        }
    }
}

tasks.register("growthPerformanceTest", JavaExec) {
    group = "verification"
    description = "Run dependency-free growth differential checks against production classes."
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.ordana.immersive_weathering.data.block_growths.area_condition.GrowthPerformanceTest"
    workingDir layout.buildDirectory.dir("growth-harness")
    doFirst { workingDir.mkdirs() }
}

tasks.register("growthPerformanceBenchmark", JavaExec) {
    group = "verification"
    description = "Measure isolated growth traversal time and thread allocations."
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.ordana.immersive_weathering.data.block_growths.area_condition.GrowthPerformanceTest"
    workingDir layout.buildDirectory.dir("growth-harness")
    doFirst { workingDir.mkdirs() }
    args "--benchmark"
    jvmArgs "-Xms512m", "-Xmx512m"
    if (providers.gradleProperty("growthNoEscapeAnalysis").isPresent()) {
        jvmArgs "-XX:-DoEscapeAnalysis"
    }
}

sourceSets {
    growthTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    snowTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    fireTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    sandstormTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register("pairedGrowthTest", JavaExec) {
    group = "verification"
    description = "Exercise production configurable growth with vanilla paired block states."
    dependsOn growthTestClasses
    classpath = sourceSets.growthTest.runtimeClasspath
    mainClass = "com.ordana.immersive_weathering.data.block_growths.PairedGrowthTest"
    workingDir layout.buildDirectory.dir("paired-growth-harness")
    args file("src/main/resources/data/immersive_weathering/block_growths").absolutePath
    doFirst { workingDir.mkdirs() }
}

tasks.named("check") {
    dependsOn growthPerformanceTest, pairedGrowthTest, "snowMechanicsTest", "fireMechanicsTest", "sandstormMechanicsTest"
}

tasks.register("snowMechanicsTest", JavaExec) {
    group = "verification"
    description = "Exercise production snow transitions with Mojang states and explicit world fixtures."
    dependsOn snowTestClasses
    classpath = sourceSets.snowTest.runtimeClasspath
    mainClass = "com.ordana.immersive_weathering.snow.SnowMechanicsTest"
    args file("src/main/resources").absolutePath
    workingDir layout.buildDirectory.dir("snow-harness")
    doFirst { workingDir.mkdirs() }
}

tasks.register("fireMechanicsTest", JavaExec) {
    group = "verification"
    description = "Exercise production fire rules with vanilla states and bounded world fixtures."
    dependsOn fireTestClasses
    classpath = sourceSets.fireTest.runtimeClasspath
    mainClass = "com.ordana.immersive_weathering.fire.FireMechanicsTest"
    workingDir layout.buildDirectory.dir("fire-harness")
    doFirst { workingDir.mkdirs() }
}

tasks.register("sandstormMechanicsTest", JavaExec) {
    group = "verification"
    description = "Exercise production storm rules with native states/attributes and explicit storage/client fixtures."
    dependsOn sandstormTestClasses
    classpath = sourceSets.sandstormTest.runtimeClasspath
    mainClass = "com.ordana.immersive_weathering.sandstorm.SandstormMechanicsTest"
    workingDir layout.buildDirectory.dir("sandstorm-harness")
    doFirst { workingDir.mkdirs() }
}
