plugins {
    id "fabric-loom" version "1.7.4"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.mod_id
}

repositories {
    maven {
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url = "https://maven.terraformersmc.com/releases" }
    maven { url = "https://maven.shedaniel.me" }
}

loom {
    accessWidenerPath = file("src/main/resources/immersive_weathering.accesswidener")
    runs {
        server {
            runDir = "run/server"
        }
        client {
            runDir = "run/client"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "curse.maven:selene-499980:${project.moonlight_file_id}"
    modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "fabric_loader_version", project.fabric_loader_version
    inputs.property "moonlight_min_version", project.moonlight_min_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "fabric_loader_version": project.fabric_loader_version,
                "moonlight_min_version": project.moonlight_min_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named("jar") {
    from("LICENSE", "COPYING", "ATTRIBUTIONS")
}

tasks.named("sourcesJar") {
    from("LICENSE", "COPYING", "ATTRIBUTIONS")
    inputs.property "version", project.version
    inputs.property "fabric_loader_version", project.fabric_loader_version
    inputs.property "moonlight_min_version", project.moonlight_min_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "fabric_loader_version": project.fabric_loader_version,
                "moonlight_min_version": project.moonlight_min_version
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = project.mod_id
        }
    }
}
